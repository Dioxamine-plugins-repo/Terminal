<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Terminal</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="tabbar">
            <div id="tab-list"></div>
            <button id="new-tab-btn" title="New tab">&#43;</button>
        </div>

        <div id="terminal-viewport"></div>

        <div id="keybar">
            <div class="keyrow">
                <button class="keybtn" data-key="Escape">ESC</button>
                <button class="keybtn" data-literal="/">/</button>
                <button class="keybtn" data-literal="-">&#8722;</button>
                <button class="keybtn" data-key="Home">HOME</button>
                <button class="keybtn" data-key="ArrowUp">&#8593;</button>
                <button class="keybtn" data-key="End">END</button>
                <button class="keybtn" data-key="PageUp">PGUP</button>
            </div>
            <div class="keyrow">
                <button class="keybtn" data-key="Tab">TAB</button>
                <button class="keybtn toggle" id="ctrl-btn" data-modifier="ctrl">CTRL</button>
                <button class="keybtn toggle" id="alt-btn" data-modifier="alt">ALT</button>
                <button class="keybtn" data-key="ArrowLeft">&#8592;</button>
                <button class="keybtn" data-key="ArrowDown">&#8595;</button>
                <button class="keybtn" data-key="ArrowRight">&#8594;</button>
                <button class="keybtn" data-key="PageDown">PGDN</button>
            </div>
        </div>
    </div>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="app.js"></script>
</body>
</html>
